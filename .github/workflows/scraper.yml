name: Job Scraper

on:
  schedule:
    # Se ejecuta cada 8 horas (00:00, 08:00, 16:00 UTC)
    - cron: "0 */8 * * *"
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub

jobs:
  scrape:
    name: Run trovilo scraper
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python 3.11
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Cachear dependencias de pip para acelerar ejecuciones futuras

      # 3. Instalar dependencias de Python
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4. Instalar Chromium y sus dependencias del sistema operativo
      - name: Instalar Playwright y dependencias del sistema
        run: playwright install --with-deps chromium

      # 5. Ejecutar el scraper con los secretos del repositorio inyectados como env vars
      - name: Ejecutar scraper
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
