name: Trovilo Scraper

on:
  # Cada 8 horas en el minuto 34 — asimétrico para romper el patrón de bots
  # que corren en horas exactas o minutos redondos (0 */8, 0 0 * * *, etc.)
  schedule:
    - cron: "34 */8 * * *"
  # Permite ejecutar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    # Variables de entorno disponibles en todos los steps del job
    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # ------------------------------------------------------------------
      # 1. Jitter de arranque — retraso aleatorio entre 1 y 180 segundos.
      #    Incluso si GitHub dispara todas las máquinas al mismo segundo,
      #    las peticiones HTTP llegan al destino en momentos impredecibles.
      # ------------------------------------------------------------------
      - name: Startup jitter (anti-fingerprint delay)
        run: |
          DELAY=$(shuf -i 1-180 -n 1)
          echo "Durmiendo ${DELAY}s antes de iniciar..."
          sleep "$DELAY"

      # ------------------------------------------------------------------
      # 2. Checkout del repositorio
      # ------------------------------------------------------------------
      - name: Checkout código
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 3. Configurar Python 3.11 con cache de pip integrado.
      #    La clave de caché incluye el hash de requirements.txt para
      #    invalidar automáticamente cuando cambien las dependencias.
      # ------------------------------------------------------------------
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------------------
      # 4. Instalar dependencias Python
      # ------------------------------------------------------------------
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 5. Instalar Chromium + dependencias del sistema para Playwright.
      #    --with-deps instala automáticamente las librerías del sistema
      #    (libglib2, libnss3, etc.) requeridas en Ubuntu sin un paso extra.
      # ------------------------------------------------------------------
      - name: Instalar Playwright Chromium
        run: playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 6. Ejecutar el scraper principal
      # ------------------------------------------------------------------
      - name: Ejecutar scraper
        run: python main.py
