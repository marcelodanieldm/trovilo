name: Job Scraper Cron Execution

on:
  schedule:
    # Se ejecuta cada 8 horas (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Permite ejecutar el bot manualmente desde la interfaz de GitHub

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el repositorio utilizando la última versión estable (v4)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución para Python (v5 es compatible con Node 24)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optimiza el tiempo instalando dependencias desde caché

      # 3. Instalar las librerías del proyecto
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Instalar los binarios del navegador de Playwright con sus dependencias del sistema
      - name: Install Playwright Web-Browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # 5. Ejecutar el orquestador inyectando las credenciales secretas del sistema
      - name: Run Mass Job Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
