<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trovilo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0c0c0c;
      --s1:       #141414;
      --s2:       #1a1a1a;
      --b1:       #202020;
      --b2:       #2c2c2c;
      --t1:       #d4d4d4;
      --t2:       #737373;
      --t3:       #383838;
      --w:        #e8e8e8;
      --r:        4px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--t1);
      font: 13px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Topbar ── */
    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--b1);
      flex-shrink: 0;
    }
    .topbar-logo { font-size: 13px; font-weight: 600; color: var(--w); letter-spacing: -.01em; }

    /* ── Layout ── */
    .body { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 156px;
      flex-shrink: 0;
      border-right: 1px solid var(--b1);
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--t3); padding: 0 8px; margin-bottom: 4px; font-weight: 500; }
    .nav-btn {
      display: block; width: 100%; text-align: left;
      padding: 6px 8px; border-radius: var(--r);
      font-size: 12.5px; color: var(--t2);
      background: none; border: none; cursor: pointer;
      transition: color .1s, background .1s;
    }
    .nav-btn:hover { color: var(--t1); background: rgba(255,255,255,.04); }
    .nav-btn.active { color: var(--w); background: rgba(255,255,255,.06); }
    .sidebar-footer { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--b1); }
    .sidebar-footer p { font-size: 10px; color: var(--t3); }

    /* ── Content ── */
    .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .scroll-panels { flex: 1; overflow-y: auto; }

    /* ── Panels ── */
    .panel      { max-width: 520px; margin: 0 auto; padding: 36px 20px; }
    .panel-wide { max-width: 860px; margin: 0 auto; padding: 36px 20px; }

    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 14px; font-weight: 600; color: var(--w); }
    .page-sub { font-size: 11.5px; color: var(--t3); margin-top: 3px; }

    /* ── Cards ── */
    .card { border: 1px solid var(--b1); border-radius: var(--r); background: var(--s1); }
    .card-body { padding: 20px; }
    .card-header {
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--b1);
    }
    .card-title { font-size: 12.5px; font-weight: 500; color: var(--t1); }

    /* ── Form ── */
    .field-group { margin-bottom: 18px; }
    .field-label {
      display: block; font-size: 10.5px; font-weight: 500;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--t2); margin-bottom: 6px;
    }
    input[type=text], input[type=email], input[type=password],
    input[type=search], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--b2);
      border-radius: var(--r); color: var(--t1);
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      padding: 7px 10px; outline: none; transition: border-color .12s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--b2); box-shadow: 0 0 0 2px rgba(255,255,255,.05); }
    input::placeholder, textarea::placeholder { color: var(--t3); }
    textarea { resize: vertical; }

    .input-with-prefix { position: relative; }
    .input-prefix-char {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--t3); pointer-events: none; font-size: 13px;
    }
    .input-with-prefix input { padding-left: 20px; }

    .hint { font-size: 11px; color: var(--t3); margin-top: 5px; }
    .err  { font-size: 11px; color: #f87171; margin-top: 5px; }

    .check-row { display: flex; gap: 18px; flex-wrap: wrap; }
    .check-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: var(--t2); cursor: pointer; user-select: none;
    }
    .check-item input[type=checkbox] { width: auto; padding: 0; accent-color: var(--w); }

    .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .pill {
      padding: 3px 10px; border-radius: 100px; font-size: 11px;
      border: 1px solid var(--b2); color: var(--t2);
      background: none; cursor: pointer; transition: all .1s;
    }
    .pill:hover { border-color: var(--b2); color: var(--t1); }
    .pill.active { border-color: var(--w); color: var(--w); background: rgba(255,255,255,.05); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 13px; border-radius: var(--r);
      font: 500 12.5px/1 system-ui, sans-serif;
      cursor: pointer; border: none; transition: all .12s;
    }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-sm   { padding: 4px 10px; font-size: 12px; }

    .btn-primary { background: var(--w); color: #000; }
    .btn-primary:hover:not(:disabled) { background: #f0f0f0; }

    .btn-ghost { background: transparent; border: 1px solid var(--b2); color: var(--t2); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--b2); color: var(--t1); background: rgba(255,255,255,.03); }

    .btn-muted { background: transparent; border: 1px solid transparent; color: var(--t3); }
    .btn-muted:hover:not(:disabled) { color: #f87171; border-color: rgba(248,113,113,.2); }

    /* ── Alert ── */
    .alert { padding: 9px 12px; border-radius: var(--r); font-size: 12px; border: 1px solid; margin-top: 14px; }
    .alert-err  { border-color: rgba(248,113,113,.2); color: #f87171;  background: rgba(248,113,113,.05); }
    .alert-ok   { border-color: rgba(74,222,128,.2);  color: #4ade80;  background: rgba(74,222,128,.05); }

    /* ── Badge ── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 1px 5px; border-radius: 3px;
      font-size: 10px; font-weight: 500; border: 1px solid;
    }
    .b-green  { color: #4ade80; border-color: rgba(74,222,128,.2);  background: rgba(74,222,128,.06); }
    .b-blue   { color: #60a5fa; border-color: rgba(96,165,250,.2);  background: rgba(96,165,250,.06); }
    .b-orange { color: #fb923c; border-color: rgba(251,146,60,.2);  background: rgba(251,146,60,.06); }
    .b-yellow { color: #facc15; border-color: rgba(250,204,21,.2);  background: rgba(250,204,21,.06); }
    .b-red    { color: #f87171; border-color: rgba(248,113,113,.2); background: rgba(248,113,113,.06); }
    .b-violet { color: #a78bfa; border-color: rgba(167,139,250,.2); background: rgba(167,139,250,.06); }
    .b-muted  { color: var(--t3); border-color: var(--b1); }

    /* ── Tag ── */
    .tag {
      display: inline-flex; padding: 2px 8px; border-radius: 100px;
      font-size: 11px; border: 1px solid var(--b2); color: var(--t2);
      cursor: pointer; transition: all .1s;
    }
    .tag:hover { color: var(--t1); border-color: var(--b2); background: rgba(255,255,255,.03); }

    /* ── Skeleton ── */
    @keyframes sh { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
    .sk {
      background: linear-gradient(90deg, var(--s1) 25%, var(--s2) 50%, var(--s1) 75%);
      background-size: 300px 100%; animation: sh 1.3s infinite linear; border-radius: 3px;
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 8px 12px;
      font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em;
      color: var(--t3); border-bottom: 1px solid var(--b1);
    }
    tbody tr { border-bottom: 1px solid var(--b1); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.025); }
    td { padding: 9px 12px; font-size: 12.5px; vertical-align: middle; }

    /* ── Job card ── */
    .job-card {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 11px 16px; border-bottom: 1px solid var(--b1);
      text-decoration: none; color: inherit; transition: background .1s;
    }
    .job-card:hover { background: rgba(255,255,255,.025); }
    .job-card:last-child { border-bottom: none; }
    .job-ico {
      width: 30px; height: 30px; flex-shrink: 0;
      border: 1px solid var(--b1); border-radius: 5px;
      background: var(--s2);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--t3); user-select: none;
      overflow: hidden;
    }
    .job-ico img { width: 100%; height: 100%; object-fit: contain; }
    .job-body  { flex: 1; min-width: 0; }
    .job-title {
      font-size: 13px; font-weight: 500; color: var(--t1);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color .1s;
    }
    .job-card:hover .job-title { color: var(--w); }
    .job-meta  { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .job-co    { font-size: 11.5px; color: var(--t2); }
    .job-time  { font-size: 11px; color: var(--t3); white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
    .job-time.hot { color: #fb923c; }

    /* ── Filter bar ── */
    .fbar { border-bottom: 1px solid var(--b1); padding: 9px 14px; flex-shrink: 0; }
    .frow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .frow + .frow { margin-top: 7px; }
    .fi {
      background: var(--bg); border: 1px solid var(--b1);
      border-radius: var(--r); color: var(--t1);
      font: 12px system-ui, sans-serif; padding: 5px 8px; outline: none;
      transition: border-color .12s;
    }
    .fi:focus { border-color: var(--b2); }
    .fi::placeholder { color: var(--t3); }
    .fi-flex { flex: 1; min-width: 130px; }
    .fpill {
      padding: 4px 9px; border-radius: var(--r); font-size: 11.5px;
      border: 1px solid var(--b1); color: var(--t2); background: none;
      cursor: pointer; transition: all .1s; font-family: system-ui, sans-serif;
    }
    .fpill:hover { color: var(--t1); border-color: var(--b2); }
    .fpill.on { color: var(--w); border-color: var(--b2); background: rgba(255,255,255,.05); }

    .toggle-wrap { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle-wrap:hover .toggle-label { color: var(--t1); }
    .toggle-label { font-size: 11.5px; color: var(--t2); transition: color .1s; }
    .toggle-track {
      width: 26px; height: 14px; border-radius: 7px;
      background: var(--b2); border: 1px solid var(--b2);
      position: relative; transition: background .15s;
    }
    .toggle-track.on { background: var(--w); border-color: var(--w); }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--t2); transition: transform .15s, background .15s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(12px); background: #000; }

    .sep { width: 1px; height: 12px; background: var(--b1); }
    .stat { font-size: 11px; color: var(--t3); }

    /* ── Fuente item ── */
    .fuente-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-radius: 3px; transition: background .1s;
    }
    .fuente-row:hover { background: rgba(255,255,255,.03); }
    .fuente-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }
    .fuente-name { font-size: 12px; color: var(--t2); font-family: 'Menlo','Consolas',monospace; margin-left: 8px; }
    .fuente-del { opacity: 0; color: var(--t3); background: none; border: none; cursor: pointer; font-size: 11px; transition: all .1s; padding: 2px 4px; border-radius: 3px; }
    .fuente-row:hover .fuente-del { opacity: 1; }
    .fuente-del:hover { color: #f87171; }

    /* ── Count chip ── */
    .chip { font-size: 10px; color: var(--t3); border: 1px solid var(--b1); padding: 1px 7px; border-radius: 100px; }

    /* ── Collapsible ── */
    .coll-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 16px; cursor: pointer; font-size: 12.5px; color: var(--t2);
      transition: color .1s; user-select: none;
    }
    .coll-hdr:hover { color: var(--t1); }
    .coll-body { padding: 0 16px 16px; border-top: 1px solid var(--b1); }

    /* ── Login ── */
    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-box  { width: 100%; max-width: 300px; }
    .login-brand { text-align: center; margin-bottom: 28px; }
    .login-brand h1 { font-size: 18px; font-weight: 600; color: var(--w); letter-spacing: -.02em; }
    .login-brand p  { font-size: 12px; color: var(--t3); margin-top: 4px; }

    /* ── Modal ── */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 100;
    }
    .modal-box { width: 100%; max-width: 340px; }

    /* ── Empty ── */
    .empty { padding: 56px 24px; text-align: center; color: var(--t3); font-size: 12.5px; }

    /* ── Tech cloud card ── */
    .cloud-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r); padding: 12px; margin-top: 10px; }
    .cloud-label { font-size: 10.5px; color: var(--t3); margin-bottom: 8px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .panel, .panel-wide { padding: 24px 14px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── LOGIN ─────────────────────────────────── -->
  <div v-if="!session" class="login-wrap">
    <div class="login-box">
      <div class="login-brand">
        <h1>trovilo</h1>
        <p>Iniciá sesión para continuar</p>
      </div>
      <div class="card card-body">
        <form @submit.prevent="login">
          <div class="field-group">
            <label class="field-label">Email</label>
            <input type="email" v-model="loginEmail" placeholder="tu@email.com" autocomplete="email" required>
          </div>
          <div class="field-group">
            <label class="field-label">Contraseña</label>
            <input type="password" v-model="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" :disabled="loginLoading">
            {{ loginLoading ? 'Verificando…' : 'Iniciar sesión' }}
          </button>
          <div v-if="loginError" class="alert alert-err">{{ loginError }}</div>
        </form>
      </div>
    </div>
  </div>

  <!-- ── DASHBOARD ──────────────────────────────── -->
  <template v-else>

    <!-- Topbar -->
    <div class="topbar">
      <span class="topbar-logo">trovilo</span>
      <button class="btn btn-ghost btn-sm" @click="logout" :disabled="logoutLoading">
        {{ logoutLoading ? 'Saliendo…' : 'Cerrar sesión' }}
      </button>
    </div>

    <!-- Body -->
    <div class="body">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="nav-section" style="margin-top:4px">Menú</div>
        <button class="nav-btn" :class="{active: panel==='busqueda'}"  @click="go('busqueda')">Búsqueda</button>
        <button class="nav-btn" :class="{active: panel==='buscador'}"  @click="go('buscador')">Empleos</button>
        <button class="nav-btn" :class="{active: panel==='fuentes'}"   @click="go('fuentes')">Fuentes</button>
        <button class="nav-btn" :class="{active: panel==='miembros'}"  @click="go('miembros')">Miembros</button>
        <div class="sidebar-footer"><p>© 2025</p></div>
      </aside>

      <!-- Content -->
      <div class="content">

        <!-- Scrollable panels -->
        <div class="scroll-panels" v-show="panel !== 'buscador'">

          <!-- ══ BÚSQUEDA ══ -->
          <div class="panel" v-show="panel === 'busqueda'">
            <div class="page-header">
              <div class="page-title">Configurar búsqueda</div>
              <div class="page-sub">Criterios para el scraper de Telegram</div>
            </div>
            <div class="card card-body">
              <form @submit.prevent="submitForm">

                <div class="field-group">
                  <label class="field-label">Tecnologías</label>
                  <input type="text" v-model="form.tech_stack" placeholder="Python, FastAPI, PostgreSQL…" required>
                  <div class="hint">Separadas por comas</div>

                  <!-- Cloud de tags -->
                  <div class="cloud-card" v-if="techCloud.length">
                    <div class="cloud-label">Buscadas por otros miembros · clic para agregar</div>
                    <div class="pills">
                      <button v-for="t in techCloud" :key="t" type="button" class="tag" @click="addTechTag(t)">{{ t }}</button>
                    </div>
                    <div style="display:flex;gap:6px;margin-top:10px">
                      <input type="text" v-model="newTag" placeholder="Agregar tag…" @keydown.enter.prevent="addNewTag" style="flex:1;font-size:12px;padding:5px 8px">
                      <button type="button" class="btn btn-ghost btn-sm" @click="addNewTag">+</button>
                    </div>
                  </div>
                </div>

                <div class="field-group">
                  <label class="field-label">Modalidad</label>
                  <div class="check-row">
                    <label class="check-item"><input type="checkbox" v-model="form.job_type" value="remote"> Remoto</label>
                    <label class="check-item"><input type="checkbox" v-model="form.job_type" value="hybrid"> Híbrido</label>
                    <label class="check-item"><input type="checkbox" v-model="form.job_type" value="on-site"> Presencial</label>
                  </div>
                  <div class="err" v-if="formSubmitted && !form.job_type.length">Seleccioná al menos una modalidad.</div>
                </div>

                <div class="field-group">
                  <label class="field-label">Ubicación</label>
                  <input type="text" v-model="form.location" placeholder="Argentina, Buenos Aires…" required>
                  <div class="pills">
                    <button v-for="loc in ['Argentina','Uruguay','Latin America','Latam']" :key="loc"
                      type="button" class="pill" :class="{active: form.location === loc}"
                      @click="form.location = loc">{{ loc }}</button>
                  </div>
                </div>

                <div class="field-group">
                  <label class="field-label">Usuario de Telegram</label>
                  <div class="input-with-prefix">
                    <span class="input-prefix-char">@</span>
                    <input type="text" v-model="form.telegram_user" placeholder="tuusuario" required>
                  </div>
                  <div class="hint">Sin el símbolo @</div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" :disabled="formLoading">
                  {{ formLoading ? 'Guardando…' : 'Guardar criterios' }}
                </button>
              </form>
              <div v-if="formError"   class="alert alert-err">{{ formError }}</div>
              <div v-if="formSuccess" class="alert alert-ok">
                {{ formSuccess }}
                <a :href="TELEGRAM_LINK" target="_blank" rel="noopener"
                   style="display:block;margin-top:4px;font-size:11px;color:inherit;opacity:.7;text-decoration:underline">
                  Ver canal de Telegram →
                </a>
              </div>
            </div>
          </div>

          <!-- ══ FUENTES ══ -->
          <div class="panel-wide" v-show="panel === 'fuentes'">
            <div class="page-header">
              <div class="page-title">Fuentes de scraping</div>
              <div class="page-sub">Dominios visitados en cada ejecución</div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start" class="fuentes-grid">

              <!-- Lista -->
              <div class="card">
                <div class="card-header">
                  <span class="card-title">Fuentes activas</span>
                  <span class="chip">{{ fuentes.length }}</span>
                </div>
                <div style="padding:10px 10px 4px">
                  <input type="search" v-model="fuentesSearch" placeholder="Filtrar…" class="fi" style="width:100%;font-size:12px;padding:5px 8px">
                </div>
                <div style="max-height:360px;overflow-y:auto;padding:4px 10px 10px">
                  <template v-if="fuentesLoading">
                    <div v-for="i in 5" :key="i" style="display:flex;align-items:center;gap:8px;padding:7px 2px">
                      <div class="sk" style="width:6px;height:6px;border-radius:50%"></div>
                      <div class="sk" :style="{height:'12px', width: (50+i*8)+'%'}"></div>
                    </div>
                  </template>
                  <template v-else-if="filteredFuentes.length">
                    <div v-for="f in filteredFuentes" :key="f.id" class="fuente-row">
                      <div style="display:flex;align-items:center">
                        <div class="fuente-dot"></div>
                        <span class="fuente-name">{{ f.domain }}</span>
                      </div>
                      <button class="fuente-del" @click="deleteFuente(f.id, f.domain)">✕</button>
                    </div>
                  </template>
                  <div v-else class="empty" style="padding:30px">Sin fuentes</div>
                </div>
              </div>

              <!-- Agregar -->
              <div class="card">
                <div class="coll-hdr" @click="fuentesOpen = !fuentesOpen">
                  <span>Agregar fuentes</span>

    <!-- Modal edición -->
    <div class="modal-bg" v-if="editModal" @click.self="closeEdit">
      <div class="modal-box card card-body">

            <label class="check-item"><input type="checkbox" v-model="editJobType" value="remote"> Remoto</label>
            <label class="check-item"><input type="checkbox" v-model="editJobType" value="hybrid"> Híbrido</label>

            {{ editLoading ? 'Guardando…' : 'Guardar' }}

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>

<script>
const SUPABASE_URL      = "https://elzivznpozizegymidqd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ulcsSFE144n7bQwG9eTvkg_zUHy3VZM";
const TELEGRAM_LINK     = "https://t.me/+qUKDg8Nc1B5hOWNh";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const { createApp, computed } = Vue;

createApp({
  data() {
    return {
      TELEGRAM_LINK,
      session: null,

      // Login
      loginEmail: '', loginPassword: '', loginLoading: false, loginError: '',
      logoutLoading: false,

      // Panel
      panel: 'busqueda',

      // Búsqueda form
      form: { tech_stack: '', job_type: [], location: '', telegram_user: '' },
      formLoading: false, formError: '', formSuccess: '', formSubmitted: false,
      techCloud: [], newTag: '',

      // Miembros
      members: [], membersLoading: false,

      // Edit modal
      editModal: false, editRow: null,
      editTech: '', editLocation: '', editJobType: [],
      editLoading: false, editError: '',

      // Fuentes
      fuentes: [], fuentesLoading: false, fuentesSearch: '', fuentesOpen: false,
      manualUrls: '', parsedDomains: [], alreadyDomains: [], newDomains: [],
      selectedDomains: [], validationDone: false,
      savingDomains: false, saveDomainsOk: false, saveDomainsErr: '',

      // Buscador
      jobs: [], jobsLoading: false, displayLimit: 100,
      jobSearch: '', jobLocation: '', jobSeniority: '', jobTime: 0,
      jobMode: 'all', soloExclusivas: false,
      communitySource: 'all', scrapingCommunity: false,
      communityStatus: '', communityStatusType: 'muted',
    };
  },

  computed: {
    filteredFuentes() {
      const q = this.fuentesSearch.toLowerCase();
      return q ? this.fuentes.filter(f => f.domain.includes(q)) : this.fuentes;
    },

    filteredJobs() {
      let j = this.jobs;
      const q   = this.jobSearch.toLowerCase();
      const loc = this.jobLocation.toLowerCase();
      const sen = this.jobSeniority.toLowerCase();

      if (this.jobTime > 0) {
        const cutoff = Date.now() - this.jobTime * 3_600_000;
        j = j.filter(x => new Date(x.sent_at).getTime() >= cutoff);
      }
      if (q) j = j.filter(x => `${x.title} ${x.company} ${x.job_url}`.toLowerCase().includes(q));
      if (loc) j = j.filter(x => `${x.title} ${x.company} ${x.job_url}`.toLowerCase().includes(loc));

      if (this.jobMode === 'remote')
        j = j.filter(x => /\b(remote|remoto|anywhere|distributed|worldwide)\b/i.test(`${x.title} ${x.job_url}`));
      else if (this.jobMode === 'hybrid')
        j = j.filter(x => /\b(h[íi]brido|hybrid)\b/i.test(x.title ?? ''));

      if (sen) {
        const map = {
          junior: /\b(junior|jr\.?|entry[\s-]level|intern|trainee)\b/i,
          mid:    /\b(mid[\s-]?level|semi[\s-]?senior|ssr|pleno|middle)\b/i,
          senior: /\b(senior|sr\.?)\b/i,
          lead:   /\b(lead|staff|principal|architect|director|head of|manager|vp|chief)\b/i,
        };
        if (map[sen]) j = j.filter(x => map[sen].test(x.title ?? ''));
      }
      if (this.soloExclusivas) j = j.filter(x => x.not_on_linkedin === true);
      return j;
    },

    newJobsCount() {
      const cutoff = Date.now() - 7 * 86_400_000;
      return this.jobs.filter(j => new Date(j.sent_at).getTime() >= cutoff).length;
    },
  },

  methods: {
    // ── Auth ──────────────────────────────────────────────
    async init() {
      const { data: { session } } = await db.auth.getSession();
      this.session = session;
      if (session) this.loadTechCloud();
    },

    async login() {
      this.loginLoading = true; this.loginError = '';
      const { error } = await db.auth.signInWithPassword({ email: this.loginEmail, password: this.loginPassword });
      if (error) {
        this.loginError = 'Credenciales incorrectas.';
      } else {
        const { data: { session } } = await db.auth.getSession();
        this.session = session;
        this.loadTechCloud();
      }
      this.loginLoading = false;
    },

    async logout() {
      this.logoutLoading = true;
      await db.auth.signOut();
      this.session = null; this.logoutLoading = false;
    },

    // ── Navigation ────────────────────────────────────────
    go(name) {
      this.panel = name;
      if (name === 'fuentes')  this.loadFuentes();
      if (name === 'miembros') this.loadMembers();
      if (name === 'buscador') this.loadJobs();
    },

    // ── Tech cloud ────────────────────────────────────────
    async loadTechCloud() {
      const { data } = await db.from('search_filters').select('tech_stack');
      if (!data?.length) return;
      const all = data.flatMap(r => (r.tech_stack ?? '').split(',')).map(t => t.trim()).filter(Boolean);
      const uniq = [...new Set(all.map(t => t.toLowerCase()))].map(t => all.find(o => o.toLowerCase() === t));
      this.techCloud = uniq.sort();
    },

    addTechTag(tech) {
      const cur = this.form.tech_stack.trim();
      const existing = cur.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      if (!existing.includes(tech.toLowerCase()))
        this.form.tech_stack = cur ? `${cur}, ${tech}` : tech;
    },

    addNewTag() {
      const t = this.newTag.trim(); if (!t) return;
      this.addTechTag(t);
      if (!this.techCloud.map(x => x.toLowerCase()).includes(t.toLowerCase()))
        this.techCloud = [...this.techCloud, t].sort();
      this.newTag = '';
    },

    // ── Submit form ───────────────────────────────────────
    async submitForm() {
      this.formSubmitted = true;
      if (!this.form.job_type.length) return;
      this.formLoading = true; this.formError = ''; this.formSuccess = '';
      const { error } = await db.from('search_filters').insert({
        tech_stack:    this.form.tech_stack,
        job_type:      this.form.job_type.join(','),
        location:      this.form.location,
        telegram_user: this.form.telegram_user.replace(/^@/, ''),
      });
      if (error) {
        this.formError = 'No se pudo guardar.'; console.error(error);
      } else {
        this.formSuccess = 'Criterios guardados correctamente.';
        this.form = { tech_stack: '', job_type: [], location: '', telegram_user: '' };
        this.formSubmitted = false;
        this.loadMembers();
      }
      this.formLoading = false;
    },

    // ── Members ───────────────────────────────────────────
    async loadMembers() {
      this.membersLoading = true;
      const { data } = await db.from('search_filters')
        .select('id, telegram_user, tech_stack, job_type, location').order('telegram_user');
      this.members = data || [];
      this.membersLoading = false;
    },

    async deleteMember(id, user) {
      if (!confirm(`¿Eliminar @${user}?`)) return;
      await db.from('search_filters').delete().eq('id', id);
      this.loadMembers();
    },

    openEdit(row) {
      this.editRow = row;
      this.editTech = row.tech_stack;
      this.editLocation = row.location;
      this.editJobType = (row.job_type ?? '').split(',').filter(Boolean);
      this.editError = '';
      this.editModal = true;
    },

    closeEdit() { this.editModal = false; },

    async saveEdit() {
      if (!this.editJobType.length) { this.editError = 'Seleccioná al menos una modalidad.'; return; }
      this.editLoading = true;
      const { error } = await db.from('search_filters')
        .update({ tech_stack: this.editTech, job_type: this.editJobType.join(','), location: this.editLocation })
        .eq('id', this.editRow.id);
      this.editLoading = false;
      if (error) { this.editError = error.message; return; }
      this.closeEdit(); this.loadMembers();
    },

    techsOf(m) { return (m.tech_stack ?? '').split(',').map(t => t.trim()).filter(Boolean); },
    jobTypeLabel(jt) {
      const map = { remote: 'Remoto', hybrid: 'Híbrido', 'on-site': 'Presencial' };
      return (jt ?? '').split(',').map(t => map[t] ?? t).filter(Boolean).join(', ');
    },

    // ── Fuentes ───────────────────────────────────────────
    async loadFuentes() {
      this.fuentesLoading = true;
      const { data } = await db.from('fuentes_scraper').select('id, domain').order('domain');
      this.fuentes = data || [];
      this.fuentesLoading = false;
    },

    async deleteFuente(id, domain) {
      if (!confirm(`¿Eliminar "${domain}"?`)) return;
      await db.from('fuentes_scraper').delete().eq('id', id);
      this.loadFuentes();
    },

    extractDomains(raws) {
      const seen = new Set(), domains = [];
      for (const raw of raws) {
        const s = String(raw ?? '').trim(); if (!s) continue;
        try {
          const url = s.startsWith('http') ? s : `https://${s}`;
          const h = new URL(url).hostname.replace(/^www\./, '');
          if (h && !seen.has(h)) { seen.add(h); domains.push(h); }
        } catch {
          const c = s.replace(/^www\./, '').split('/')[0].toLowerCase();
          if (c && !seen.has(c)) { seen.add(c); domains.push(c); }
        }
      }
      return domains;
    },

    processUrls() {
      const lines = this.manualUrls.split('\n').map(l => l.trim()).filter(Boolean);
      this.parsedDomains = this.extractDomains(lines);
      this.validationDone = false; this.alreadyDomains = []; this.newDomains = [];
      this.selectedDomains = []; this.saveDomainsOk = false; this.saveDomainsErr = '';
    },

    async handleFile(e) {
      const file = e.target.files?.[0]; if (!file) return;
      try {
        const buf = await file.arrayBuffer();
        const wb  = XLSX.read(buf, { type: 'array' });
        const sh  = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sh, { header: 1 });
        this.parsedDomains = this.extractDomains(rows.map(r => r[0]).filter(Boolean));
        this.validationDone = false; this.alreadyDomains = []; this.newDomains = [];
        this.selectedDomains = []; this.saveDomainsOk = false; this.saveDomainsErr = '';
      } catch { alert('No se pudo leer el archivo.'); }
    },

    async validateDomains() {
      const { data } = await db.from('fuentes_scraper').select('domain');
      const existSet = new Set((data || []).map(r => r.domain.toLowerCase()));
      this.alreadyDomains = this.parsedDomains.filter(d => existSet.has(d.toLowerCase()));
      this.newDomains = this.parsedDomains.filter(d => !existSet.has(d.toLowerCase()));
      this.selectedDomains = [...this.newDomains];
      this.validationDone = true;
    },

    async saveDomains() {
      if (!this.selectedDomains.length) return;
      this.savingDomains = true; this.saveDomainsErr = '';
      const { error } = await db.from('fuentes_scraper')
        .upsert(this.selectedDomains.map(d => ({ domain: d })), { onConflict: 'domain' });
      this.savingDomains = false;
      if (error) { this.saveDomainsErr = error.message; return; }
      this.saveDomainsOk = true;
      this.newDomains = []; this.selectedDomains = [];
      this.parsedDomains = []; this.manualUrls = '';
      this.validationDone = false;
      this.loadFuentes();
    },

    // ── Jobs ──────────────────────────────────────────────
    async loadJobs() {
      this.jobsLoading = true; this.jobs = []; this.displayLimit = 100;
      this.jobSearch = ''; this.jobLocation = ''; this.jobSeniority = '';
      this.jobTime = 0; this.jobMode = 'all'; this.soloExclusivas = false;
      this.communityStatus = '';
      const { data } = await db.from('sent_jobs')
        .select('title, company, job_url, sent_at, not_on_linkedin')
        .order('sent_at', { ascending: false });
      this.jobs = data || [];
      this.jobsLoading = false;
    },

    async scrapeCommunity() {
      this.scrapingCommunity = true; this.communityStatus = '';
      try {
        const p = new URLSearchParams({ q: this.jobSearch, location: this.jobLocation, source: this.communitySource, limit: '120' });
        const res = await fetch(`http://127.0.0.1:8765/search?${p}`);
        const pl  = await res.json();
        if (!res.ok || !pl.ok) throw new Error(pl.error || `HTTP ${res.status}`);
        const byUrl = new Map(this.jobs.map(j => [j.job_url, j]));
        for (const job of pl.jobs || []) {
          if (!job?.job_url) continue;
          byUrl.set(job.job_url, { ...job, sent_at: job.sent_at || new Date().toISOString(), not_on_linkedin: job.not_on_linkedin !== false });
        }
        this.jobs = Array.from(byUrl.values()).sort((a, b) => new Date(b.sent_at) - new Date(a.sent_at));
        this.communityStatus = `${pl.count || 0} encontradas`; this.communityStatusType = 'ok';
      } catch(e) {
        this.communityStatus = 'API local apagada'; this.communityStatusType = 'error';
      }
      this.scrapingCommunity = false;
    },

    locOf(job) {
      const text = `${job.title ?? ''} ${job.company ?? ''}`.toLowerCase();
      if (/\b(remote|remoto|anywhere|distributed|worldwide)\b/.test(text)) return { label: 'Remote', cls: 'b-green' };
      if (/\b(latam|latin\s*america|argentina|uruguay|chile|colombia|brasil|brazil|m[eé]xico|peru)\b/.test(text)) return { label: 'LATAM', cls: 'b-blue' };
      try {
        const host = new URL(job.job_url ?? '').hostname;
        const ats = { greenhouse:'Greenhouse', lever:'Lever', ashby:'Ashby', workable:'Workable', smartrecruiters:'SmartRecruiters', bamboohr:'BambooHR', remoteok:'RemoteOK', remotive:'Remotive', breezy:'Breezy', recruitee:'Recruitee' };
        for (const [k, v] of Object.entries(ats)) if (host.includes(k)) return { label: v, cls: 'b-muted' };
      } catch {}
      return null;
    },

    senOf(job) {
      const t = (job.title ?? '').toLowerCase();
      if (/\b(lead|staff|principal|architect|director|head of|manager|vp|chief)\b/.test(t)) return { label: 'Lead', cls: 'b-red' };
      if (/\b(senior|sr\.?)\b/.test(t)) return { label: 'Senior', cls: 'b-orange' };
      if (/\b(mid[\s-]?level|semi[\s-]?senior|ssr|pleno|middle)\b/.test(t)) return { label: 'Mid', cls: 'b-yellow' };
      if (/\b(junior|jr\.?|entry[\s-]level|intern|trainee)\b/.test(t)) return { label: 'Junior', cls: 'b-green' };
      return null;
    },

    timeOf(dateStr) {
      const diff  = Math.max(0, Date.now() - new Date(dateStr).getTime());
      const mins  = Math.floor(diff / 60_000);
      const hours = Math.floor(diff / 3_600_000);
      const days  = Math.floor(diff / 86_400_000);
      if (mins  < 1)  return { text: 'ahora', hot: true };
      if (mins  < 60) return { text: `${mins}m`, hot: true };
      if (hours < 6)  return { text: `${hours}h`, hot: true };
      if (hours < 24) return { text: `${hours}h`, hot: false };
      if (days  < 7)  return { text: `${days}d`, hot: false };
      return { text: new Date(dateStr).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }), hot: false };
    },

    faviconOf(job) {
      try { return `https://www.google.com/s2/favicons?sz=32&domain=${new URL(job.job_url).hostname}`; }
      catch { return null; }
    },

    initOf(job) { return (job.company ?? job.title ?? '?')[0].toUpperCase(); },
  },

  mounted() { this.init(); },
}).mount('#app');
</script>
</body>
</html>
