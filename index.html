<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trovilo — Configurar búsqueda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Transición de opacidad para el cambio login ↔ dashboard */
      .fade { transition: opacity 0.25s ease; }
    </style>
  </head>

  <body class="min-h-screen bg-gray-950 text-white">

    <!-- ═══════════════════════════════════════════════════════════════════
         VISTA: LOGIN
         Centrada en pantalla, oculta cuando el usuario está autenticado
    ════════════════════════════════════════════════════════════════════ -->
    <div
      id="loginView"
      class="min-h-screen flex items-center justify-center px-4 fade"
    >
      <div class="w-full max-w-sm bg-gray-900 rounded-2xl shadow-xl p-8">

        <!-- Logo -->
        <div class="mb-8 text-center">
          <h1 class="text-3xl font-bold text-white tracking-tight">trovilo</h1>
          <p class="mt-1 text-sm text-gray-400">Iniciá sesión para continuar</p>
        </div>

        <!-- Formulario de login -->
        <form id="loginForm" class="space-y-4" novalidate>

          <div>
            <label for="loginEmail" class="block text-sm font-medium text-gray-300 mb-1">
              Email
            </label>
            <input
              type="email"
              id="loginEmail"
              placeholder="tu@email.com"
              required
              autocomplete="email"
              class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                     placeholder-gray-500 px-4 py-2.5 text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                     transition"
            />
          </div>

          <div>
            <label for="loginPassword" class="block text-sm font-medium text-gray-300 mb-1">
              Contraseña
            </label>
            <input
              type="password"
              id="loginPassword"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                     placeholder-gray-500 px-4 py-2.5 text-sm
                     focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                     transition"
            />
          </div>

          <button
            type="submit"
            id="loginBtn"
            class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700
                   text-white font-semibold text-sm py-3 mt-1
                   focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-gray-900
                   transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Iniciar sesión
          </button>
        </form>

        <!-- Error de login -->
        <div id="loginError" class="hidden mt-4 text-xs text-red-400 text-center bg-red-900/30 border border-red-800 rounded-lg px-3 py-2"></div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════
         VISTA: DASHBOARD
         Oculta por defecto, visible tras autenticación exitosa
    ════════════════════════════════════════════════════════════════════ -->
    <div id="dashboardView" class="hidden min-h-screen flex flex-col fade">

      <!-- Header sticky con botón de logout -->
      <header class="sticky top-0 z-50 bg-gray-950/90 backdrop-blur border-b border-gray-800">
        <div class="max-w-2xl mx-auto px-4 h-12 flex items-center justify-between">
          <span class="text-sm font-semibold text-white tracking-tight">trovilo</span>
          <button
            id="logoutBtn"
            onclick="handleLogout()"
            class="text-xs text-zinc-400 border border-zinc-700 rounded-md px-3 py-1.5
                   hover:bg-zinc-800 hover:text-zinc-200 hover:border-zinc-600
                   focus:outline-none focus:ring-2 focus:ring-zinc-600
                   transition"
          >
            Cerrar sesión
          </button>
        </div>
      </header>

      <!-- Contenido del dashboard -->
      <main class="flex-1 flex items-start justify-center px-4 py-10">
        <div class="w-full max-w-md bg-gray-900 rounded-2xl shadow-xl p-8">

          <!-- Encabezado -->
          <div class="mb-8 text-center">
            <h2 class="text-2xl font-bold text-white tracking-tight">Configurar búsqueda</h2>
            <p class="mt-1 text-sm text-gray-400">Tus criterios para el scraper de empleos</p>
          </div>

          <!-- Formulario de filtros -->
          <form id="filterForm" class="space-y-5" novalidate>

            <!-- Tecnologías -->
            <div>
              <label for="tech_stack" class="block text-sm font-medium text-gray-300 mb-1">
                Tecnologías
              </label>
              <input
                type="text"
                id="tech_stack"
                name="tech_stack"
                placeholder="ej. Python, FastAPI, PostgreSQL"
                required
                class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                       placeholder-gray-500 px-4 py-2.5 text-sm
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                       transition"
              />
              <p class="mt-1 text-xs text-gray-500">Separadas por comas</p>
            </div>

            <!-- Modalidad -->
            <div>
              <label for="job_type" class="block text-sm font-medium text-gray-300 mb-1">
                Modalidad
              </label>
              <select
                id="job_type"
                name="job_type"
                required
                class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                       px-4 py-2.5 text-sm
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                       transition appearance-none cursor-pointer"
              >
                <option value="" disabled selected>Seleccioná una modalidad</option>
                <option value="remote">Remoto</option>
                <option value="hybrid">Híbrido</option>
                <option value="on-site">Presencial</option>
              </select>
            </div>

            <!-- Ubicación -->
            <div>
              <label for="location" class="block text-sm font-medium text-gray-300 mb-1">
                Ubicación
              </label>
              <input
                type="text"
                id="location"
                name="location"
                placeholder="ej. Argentina, Buenos Aires"
                required
                class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                       placeholder-gray-500 px-4 py-2.5 text-sm
                       focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                       transition"
              />
            </div>

            <!-- Usuario de Telegram -->
            <div>
              <label for="telegram_user" class="block text-sm font-medium text-gray-300 mb-1">
                Usuario de Telegram
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-500 text-sm select-none">@</span>
                <input
                  type="text"
                  id="telegram_user"
                  name="telegram_user"
                  placeholder="tuusuario"
                  required
                  class="w-full rounded-lg bg-gray-800 border border-gray-700 text-white
                         placeholder-gray-500 pl-7 pr-4 py-2.5 text-sm
                         focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                         transition"
                />
              </div>
              <p class="mt-1 text-xs text-gray-500">Sin el símbolo @</p>
            </div>

            <!-- Botón guardar -->
            <button
              type="submit"
              id="submitBtn"
              class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700
                     text-white font-semibold text-sm py-3
                     focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-gray-900
                     transition disabled:opacity-50 disabled:cursor-not-allowed"
            >
              Guardar criterios
            </button>
          </form>

          <!-- Mensaje de estado -->
          <div id="statusMsg" class="mt-5 hidden text-sm text-center rounded-lg px-4 py-3 font-medium"></div>
        </div>
      </main>
    </div>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // ─── Configuración de Supabase ────────────────────────────────────────
      // Reemplazá estos valores con los de tu proyecto en supabase.com
      const SUPABASE_URL     = "https://TU_PROJECT_ID.supabase.co";
      const SUPABASE_ANON_KEY = "TU_ANON_KEY";
      // ──────────────────────────────────────────────────────────────────────

      const { createClient } = supabase;
      const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // ─── Referencias al DOM ───────────────────────────────────────────────
      const loginView    = document.getElementById("loginView");
      const dashboardView = document.getElementById("dashboardView");
      const loginForm    = document.getElementById("loginForm");
      const loginError   = document.getElementById("loginError");
      const loginBtn     = document.getElementById("loginBtn");
      const filterForm   = document.getElementById("filterForm");
      const submitBtn    = document.getElementById("submitBtn");
      const statusMsg    = document.getElementById("statusMsg");

      // ─── Gestión de vistas ────────────────────────────────────────────────

      // Muestra el dashboard y oculta el login
      function showDashboard() {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
      }

      // Muestra el login y oculta el dashboard
      function showLogin() {
        dashboardView.classList.add("hidden");
        // Limpiar el formulario de filtros para no exponer datos de la sesión anterior
        filterForm.reset();
        statusMsg.classList.add("hidden");
        loginView.classList.remove("hidden");
      }

      // ─── Verificar sesión activa al cargar la página ──────────────────────
      // Si Supabase tiene una sesión guardada en localStorage, ir directo al dashboard
      (async () => {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
          showDashboard();
        }
      })();

      // ─── Login ────────────────────────────────────────────────────────────
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email    = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        loginBtn.disabled    = true;
        loginBtn.textContent = "Verificando...";
        loginError.classList.add("hidden");

        const { error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
          // Mostrar error sin revelar si el usuario existe o no (seguridad)
          loginError.textContent = "Credenciales incorrectas. Intentá de nuevo.";
          loginError.classList.remove("hidden");
        } else {
          showDashboard();
        }

        loginBtn.disabled    = false;
        loginBtn.textContent = "Iniciar sesión";
      });

      // ─── Logout ───────────────────────────────────────────────────────────
      async function handleLogout() {
        const btn = document.getElementById("logoutBtn");
        btn.disabled    = true;
        btn.textContent = "Cerrando...";

        // Cierra la sesión en Supabase y limpia el token de localStorage
        await db.auth.signOut();

        // Volver al login con el formulario limpio
        showLogin();

        btn.disabled    = false;
        btn.textContent = "Cerrar sesión";
      }

      // ─── Formulario de filtros ────────────────────────────────────────────

      function showStatus(message, isError = false) {
        statusMsg.textContent = message;
        statusMsg.className = [
          "mt-5 text-sm text-center rounded-lg px-4 py-3 font-medium",
          isError
            ? "bg-red-900/50 text-red-300 border border-red-700"
            : "bg-green-900/50 text-green-300 border border-green-700",
        ].join(" ");
        statusMsg.classList.remove("hidden");
      }

      filterForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const telegramRaw = document.getElementById("telegram_user").value.trim();

        // Armar el objeto a insertar según el esquema de 'search_filters'
        const payload = {
          tech_stack:    document.getElementById("tech_stack").value.trim(),
          job_type:      document.getElementById("job_type").value,
          location:      document.getElementById("location").value.trim(),
          // Guardar siempre sin '@' para mantener consistencia en la BD
          telegram_user: telegramRaw.replace(/^@/, ""),
        };

        submitBtn.disabled    = true;
        submitBtn.textContent = "Guardando...";
        statusMsg.classList.add("hidden");

        const { error } = await db.from("search_filters").insert(payload);

        if (error) {
          console.error("[trovilo] Error al guardar:", error.message);
          showStatus("❌ No se pudo guardar. Revisá la consola para más detalles.", true);
        } else {
          showStatus("✅ Criterios guardados correctamente.");
          filterForm.reset();
        }

        submitBtn.disabled    = false;
        submitBtn.textContent = "Guardar criterios";
      });
    </script>
  </body>
</html>
